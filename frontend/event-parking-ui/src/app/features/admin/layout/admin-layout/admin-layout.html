<div class="admin-shell">

  <aside class="sidebar">

    <div class="brand">

      <div class="brand-mark">
        P
      </div>

      <div class="brand-copy">
        <strong>EVENT PARKING</strong>
        <span>Reservation System</span>
      </div>

    </div>


    <div class="sidebar-intro">

      <span>
        Administration
      </span>

      <strong>
        Operations Console
      </strong>

    </div>


    <nav class="sidebar-nav">

      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">

        <span class="nav-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="2"></rect>
            <rect x="14" y="3" width="7" height="7" rx="2"></rect>
            <rect x="3" y="14" width="7" height="7" rx="2"></rect>
            <rect x="14" y="14" width="7" height="7" rx="2"></rect>
          </svg>
        </span>

        <span>Dashboard</span>

      </a>


      <a
        routerLink="/admin/events"
        routerLinkActive="active">

        <span class="nav-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
            <path d="M16 3v4M8 3v4M3 11h18"></path>
          </svg>
        </span>

        <span>Events</span>

      </a>


      <a
        routerLink="/admin/venues"
        routerLinkActive="active">

        <span class="nav-icon">
          <svg viewBox="0 0 24 24">
            <path d="M4 21V10l8-6 8 6v11"></path>
            <path d="M9 21v-6h6v6"></path>
          </svg>
        </span>

        <span>Venues</span>

      </a>


      <a
        routerLink="/admin/categories"
        routerLinkActive="active">

        <span class="nav-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="2"></rect>
            <rect x="14" y="3" width="7" height="7" rx="2"></rect>
            <rect x="3" y="14" width="7" height="7" rx="2"></rect>
            <rect x="14" y="14" width="7" height="7" rx="2"></rect>
          </svg>
        </span>

        <span>Categories</span>

      </a>


      <a
        routerLink="/admin/seats"
        routerLinkActive="active">

        <span class="nav-icon">
          <svg viewBox="0 0 24 24">
            <path d="M7 11V7a2 2 0 0 1 4 0v4"></path>
            <path d="M13 11V7a2 2 0 0 1 4 0v4"></path>
            <path d="M5 11h14v7H5z"></path>
            <path d="M7 18v3M17 18v3"></path>
          </svg>
        </span>

        <span>Seat Layout</span>

      </a>


      <a
        routerLink="/admin/parking"
        routerLinkActive="active">

        <span class="nav-icon">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="3" width="16" height="18" rx="3"></rect>
            <path d="M9 17V7h4a3 3 0 0 1 0 6H9"></path>
          </svg>
        </span>

        <span>Parking Layout</span>

      </a>


      <a
        routerLink="/admin/customers"
        routerLinkActive="active">

        <span class="nav-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="9" cy="8" r="3"></circle>
            <circle cx="17" cy="9" r="2"></circle>
            <path d="M3 20a6 6 0 0 1 12 0"></path>
            <path d="M14 16a5 5 0 0 1 7 4"></path>
          </svg>
        </span>

        <span>Customers</span>

      </a>

    </nav>


    <div class="sidebar-footer">
  <button
    type="button"
    class="logout-button"
    (click)="logout()"
    title="Sign out">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M10 17l5-5-5-5"></path>
      <path d="M15 12H3"></path>
      <path d="M14 3h4a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-4"></path>
    </svg>
    <span>Logout</span>
  </button>
</div>

  </aside>


  <main class="content">

    <div class="content-inner">
      <router-outlet></router-outlet>
    </div>

  </main>

</div>
