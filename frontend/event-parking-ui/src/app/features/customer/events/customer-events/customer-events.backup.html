<section>

<h1>
  Upcoming Events
</h1>

<p>
  Select an event and reserve your seat.
</p>


<div class="event-grid">

  <div class="event-card" *ngFor="let event of events">

    <h2>
      {{event.name}}
    </h2>

    <p>
      Date: {{event.date}}
    </p>

    <p>
      Venue: {{event.venue}}
    </p>

    <p>
      Category: {{event.category}}
    </p>

    <p>
      Available Seats: {{event.seats}}
    </p>


    <button>
      Book Now
    </button>

  </div>


</div>

</section>
