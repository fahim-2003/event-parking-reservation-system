<section class="events-page">

<h1>
  Upcoming Events
</h1>

<p>
  Select an event and reserve your parking.
</p>


@if(loading)
{

<p>
 Loading events...
</p>

}


@if(errorMessage)
{

<p>
 {{errorMessage}}
</p>

}



<div class="event-grid">


@for(event of events; track event.id)
{

<div class="event-card">


<h2>
 {{event.name}}
</h2>


<p>
 Event Date:
 {{event.date}}
</p>


<p>
 Capacity:
 {{event.capacity}}
</p>


<button>
 Book Now
</button>


</div>

}


</div>


</section>
