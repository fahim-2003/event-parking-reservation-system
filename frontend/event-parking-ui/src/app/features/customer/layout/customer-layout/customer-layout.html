<div class="customer-shell">

  <aside class="sidebar">

    <div class="brand">

      <div class="brand-mark">
        P
      </div>

      <div class="brand-copy">
        <strong>EVENT PARKING</strong>
        <span>Reservation System</span>
      </div>

    </div>


    <div class="workspace-card">

      <span>
        Customer workspace
      </span>

      <strong>
        Plan your event visit
      </strong>

    </div>


    <nav class="sidebar-nav">

      <a
        routerLink="/customer/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8">

            <rect
              x="3"
              y="3"
              width="7"
              height="7"
              rx="2">
            </rect>

            <rect
              x="14"
              y="3"
              width="7"
              height="7"
              rx="2">
            </rect>

            <rect
              x="3"
              y="14"
              width="7"
              height="7"
              rx="2">
            </rect>

            <rect
              x="14"
              y="14"
              width="7"
              height="7"
              rx="2">
            </rect>

          </svg>

        </span>

        <span class="nav-label">
          Dashboard
        </span>

      </a>


      <a
        routerLink="/customer/events"
        routerLinkActive="active">

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8">

            <circle
              cx="11"
              cy="11"
              r="7">
            </circle>

            <path
              d="m20 20-3.5-3.5">
            </path>

          </svg>

        </span>

        <span class="nav-label">
          Browse Events
        </span>

      </a>


      <a
        routerLink="/customer/bookings/summary"
        routerLinkActive="active">

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8">

            <path
              d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4Z">
            </path>

            <path
              d="M9 9h6M9 13h4">
            </path>

          </svg>

        </span>

        <span class="nav-label">
          My Bookings
        </span>

      </a>


      <a
        routerLink="/customer/payments"
        routerLinkActive="active">

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8">

            <rect
              x="3"
              y="5"
              width="18"
              height="14"
              rx="3">
            </rect>

            <path
              d="M3 10h18">
            </path>

            <path
              d="M7 15h3">
            </path>

          </svg>

        </span>

        <span class="nav-label">
          Payments
        </span>

      </a>


      <a
        routerLink="/customer/notifications"
        routerLinkActive="active">

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8">

            <path
              d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9">
            </path>

            <path
              d="M13.7 21a2 2 0 0 1-3.4 0">
            </path>

          </svg>

        </span>

        <span class="nav-label">
          Notifications
        </span>

      </a>


      <a
        routerLink="/customer/profile"
        routerLinkActive="active">

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8">

            <circle
              cx="12"
              cy="8"
              r="4">
            </circle>

            <path
              d="M4 21a8 8 0 0 1 16 0">
            </path>

          </svg>

        </span>

        <span class="nav-label">
          Profile
        </span>

      </a>

    </nav>


    <div class="sidebar-footer">

      <div class="avatar">
        C
      </div>

      <div class="account-copy">

        <strong>
          Customer
        </strong>

        <span>
          Reservation account
        </span>

      </div>

      <span class="online-dot"></span>

    </div>

  </aside>


  <main class="content">

    <div class="content-inner">
      <router-outlet></router-outlet>
    </div>

  </main>

</div>
