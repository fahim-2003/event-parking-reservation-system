<main class="cinematic-page">

  <div class="stadium-background"></div>
  <div class="night-overlay"></div>

  <!-- Entrance scene -->
  <section class="entrance-scene" aria-hidden="true">

    <div class="road">
      <div class="lane-line lane-line-1"></div>
      <div class="lane-line lane-line-2"></div>
      <div class="lane-line lane-line-3"></div>
    </div>

    <div class="gate-post gate-post-left"></div>
    <div class="gate-post gate-post-right"></div>

    <div class="gate-arm">
      <span class="gate-stripe stripe-1"></span>
      <span class="gate-stripe stripe-2"></span>
      <span class="gate-stripe stripe-3"></span>
    </div>

    <div class="car">
      <div class="car-roof"></div>

      <div class="windshield"></div>

      <div class="headlight headlight-left"></div>
      <div class="headlight headlight-right"></div>

      <div class="wheel wheel-left"></div>
      <div class="wheel wheel-right"></div>
    </div>

    <div class="light-beam beam-left"></div>
    <div class="light-beam beam-right"></div>

  </section>


  <!-- Final landing content -->
  <section class="hero-content">

    <div class="brand-mark">
      EVENT PARKING
    </div>

    <p class="hero-kicker">
      YOUR EVENT. YOUR SPACE.
    </p>

    <h1>
      Park Smarter.
      <span>Enjoy the Event.</span>
    </h1>

    <p class="hero-description">
      Reserve your event seat and parking space in one place.
    </p>

    <div class="hero-actions">

      <a
        routerLink="/register"
        class="primary-action">
        Get Started
      </a>

      <a
        routerLink="/login"
        class="secondary-action">
        Sign In
      </a>

    </div>

  </section>

</main>
