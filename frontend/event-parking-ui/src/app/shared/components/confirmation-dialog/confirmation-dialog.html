@if (open) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center
           bg-slate-950/20 p-4 backdrop-blur-sm"
  >
    <div
      class="w-full max-w-md rounded-3xl border border-white/80
             bg-white/80 p-6 shadow-2xl shadow-slate-400/20
             backdrop-blur-2xl"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title"
    >
      <h2 class="text-xl font-semibold text-slate-900">
        {{ title }}
      </h2>

      <p class="mt-3 leading-6 text-slate-600">
        {{ message }}
      </p>

      <div class="mt-7 flex justify-end gap-3">
        <button
          type="button"
          class="rounded-xl border border-slate-200 bg-white/80
                 px-4 py-2.5 text-sm font-semibold text-slate-700
                 transition hover:bg-slate-50"
          (click)="cancel()"
        >
          {{ cancelLabel }}
        </button>

        <button
          type="button"
          class="rounded-xl px-4 py-2.5 text-sm font-semibold
                 text-white shadow-lg transition"
          [class.bg-rose-600]="danger"
          [class.hover:bg-rose-700]="danger"
          [class.bg-indigo-600]="!danger"
          [class.hover:bg-indigo-700]="!danger"
          (click)="confirm()"
        >
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
