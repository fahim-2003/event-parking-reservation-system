<div
  class="rounded-2xl border border-rose-200 bg-rose-50/80
         p-4 shadow-sm backdrop-blur-xl"
  role="alert"
>
  <div class="flex gap-3">
    <div
      class="flex h-9 w-9 shrink-0 items-center justify-center
             rounded-xl bg-rose-100 font-bold text-rose-700"
      aria-hidden="true"
    >
      !
    </div>

    <div class="min-w-0">
      <h3 class="font-semibold text-rose-900">
        {{ title }}
      </h3>

      <p class="mt-1 text-sm leading-6 text-rose-700">
        {{ message }}
      </p>

      @if (traceId) {
        <p class="mt-2 text-xs text-rose-600">
          Reference: {{ traceId }}
        </p>
      }
    </div>
  </div>
</div>
